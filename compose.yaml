name: shouban-official-website

services:
  web:
    image: ${SHOUBAN_IMAGE:?Set an immutable image reference}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?Set NEXT_PUBLIC_SITE_URL before building}
    env_file:
      - ${SHOUBAN_RUNTIME_ENV_FILE:?Set the path to the protected runtime env file}
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    networks:
      proxy:
        aliases:
          - shouban-web
    expose:
      - "3000"
    init: true
    restart: unless-stopped
    cpus: "1.0"
    mem_limit: 1536m
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((response) => process.exit(response.status === 200 ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 30s

networks:
  proxy:
    external: true
    name: ${SHOUBAN_PROXY_NETWORK:?Set the dedicated external proxy network name}
